# Local development services only. UAT and production run on AWS
# (docs/07-operations/AWS_ENVIRONMENTS_AND_DEPLOYMENT.md).
# Credentials here are local defaults, not secrets. Ports can be changed in .env.
name: labconnect

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labconnect}
      POSTGRES_DB: ${POSTGRES_DB:-labconnect}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.10.0
    environment:
      discovery.type: single-node
      # Local only: no TLS, no authentication.
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '${OPENSEARCH_PORT:-9200}:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 10s
      retries: 30

  localstack:
    # Pinned on purpose (OQ-23). Images from the 2026.x line refuse to start without a
    # LOCALSTACK_AUTH_TOKEN; 4.14.0 is the last release that runs without an account.
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ap-south-1
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:4566/_localstack/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  opensearch-data:
