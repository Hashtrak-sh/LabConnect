  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /auth/logout-all:
    $ref: './paths/auth.yaml#/logout-all'
  # Me (API_CONTRACTS.md §1)
  /me:
    $ref: './paths/me.yaml#/me'
  /me/active-membership:
    $ref: './paths/me.yaml#/active-membership'
  /me/notification-preferences:
    $ref: './paths/me.yaml#/notification-preferences'
  /me/notifications:
    $ref: './paths/me.yaml#/notifications'
  /me/notifications/{id}/read:
    $ref: './paths/me.yaml#/notification-read'
  # Public (API_CONTRACTS.md §2)
  /public/search/labs:
    $ref: './paths/public-search.yaml#/search-labs'
  /public/search/suggest:
    $ref: './paths/public-search.yaml#/search-suggest'
  /public/lab-sites/{siteId}:
    $ref: './paths/public-lab-sites.yaml#/lab-site'
  /public/lab-sites/{siteId}/scope:
    $ref: './paths/public-lab-sites.yaml#/lab-site-scope'
  /public/lab-sites/{siteId}/prices:
    $ref: './paths/public-lab-sites.yaml#/lab-site-prices'
  /public/lab-sites/{siteId}/slots:
    $ref: './paths/public-lab-sites.yaml#/lab-site-slots'
  /public/leads:
    $ref: './paths/public-search.yaml#/leads'
  /public/taxonomies/{code}/nodes:
    $ref: './paths/public-search.yaml#/taxonomy-nodes'
  /public/verify/{verificationCode}:
    $ref: './paths/public-reports.yaml#/verify'
  /public/share/{token}:
    $ref: './paths/public-reports.yaml#/share'
  # Payments (API_CONTRACTS.md §5)
  /bookings/{id}/payments:
    $ref: './paths/payments.yaml#/booking-payments'
  /webhooks/payments/{gateway}:
    $ref: './paths/payments.yaml#/payment-webhook'
  /payments/return:
    $ref: './paths/payments.yaml#/payment-return'
  /bookings/{id}/financial-documents:
    $ref: './paths/payments.yaml#/booking-financial-documents'
  /financial-documents/{id}/download:
    $ref: './paths/payments.yaml#/financial-document-download'
  # Disputes (API_CONTRACTS.md §9)
  /bookings/{id}/disputes:
    $ref: './paths/disputes.yaml#/booking-disputes'
  /disputes/{id}:
    $ref: './paths/disputes.yaml#/dispute'
  /disputes/{id}/messages:
    $ref: './paths/disputes.yaml#/dispute-messages'
  /disputes/{id}/evidence/upload-url:
    $ref: './paths/disputes.yaml#/dispute-evidence-upload-url'
  /disputes/{id}/evidence:
    $ref: './paths/disputes.yaml#/dispute-evidence'
  /disputes/{id}/withdraw:
    $ref: './paths/disputes.yaml#/dispute-withdraw'
  # Platform
  /health:
    $ref: './paths/health.yaml#/health'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access JWT (EdDSA, 10 minutes; claims `sub`, `sid`, `amr`, `mfa_at`). A partial session
        (MFA still pending) is accepted only by `/auth/mfa/*` and `/auth/logout`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: lc_refresh
      description: >-
        Opaque rotating refresh token in an httpOnly, Secure, SameSite=Lax cookie scoped to the
        API domain. Accepted only by `/auth/refresh`.

