  # Public (API_CONTRACTS.md §2)
  /public/search/labs:
    $ref: './paths/public-search.yaml#/search-labs'
  /public/search/suggest:
    $ref: './paths/public-search.yaml#/search-suggest'
  /public/lab-sites/{siteId}:
    $ref: './paths/public-lab-sites.yaml#/lab-site'
  /public/lab-sites/{siteId}/scope:
    $ref: './paths/public-lab-sites.yaml#/lab-site-scope'
  /public/lab-sites/{siteId}/prices:
    $ref: './paths/public-lab-sites.yaml#/lab-site-prices'
  /public/lab-sites/{siteId}/slots:
    $ref: './paths/public-lab-sites.yaml#/lab-site-slots'
  /public/leads:
    $ref: './paths/public-search.yaml#/leads'
  /public/taxonomies/{code}/nodes:
    $ref: './paths/public-search.yaml#/taxonomy-nodes'
  /public/verify/{verificationCode}:
    $ref: './paths/public-reports.yaml#/verify'
  /public/share/{token}:
    $ref: './paths/public-reports.yaml#/share'
  # Custody and receipt (API_CONTRACTS.md §7)
  /custody/scan:
    $ref: './paths/custody.yaml#/scan'
  /custody/scan-batch:
    $ref: './paths/custody.yaml#/scan-batch'
  /bookings/{id}/receipts/photos/upload-url:
    $ref: './paths/custody.yaml#/receipt-photo-upload-url'
  /bookings/{id}/receipts:
    $ref: './paths/custody.yaml#/receipts'
  /receipts/{id}/approve:
    $ref: './paths/custody.yaml#/receipt-approve'
  /receipts/{id}/confirm-discrepancy:
    $ref: './paths/custody.yaml#/receipt-confirm-discrepancy'
  /receipts/{id}/reject-unfit:
    $ref: './paths/custody.yaml#/receipt-reject-unfit'
  /packages/{id}/reprint-requests:
    $ref: './paths/custody.yaml#/package-reprint-requests'
  /reprint-requests/{id}/approve:
    $ref: './paths/custody.yaml#/reprint-request-approve'
  # Reports (API_CONTRACTS.md §8)
  /bookings/{id}/report-versions/upload-url:
    $ref: './paths/reports.yaml#/report-upload-url'
  /bookings/{id}/report-versions:
    $ref: './paths/reports.yaml#/report-versions'
  /report-versions/{id}/submit:
    $ref: './paths/reports.yaml#/report-version-submit'
  /report-versions/{id}/return:
    $ref: './paths/reports.yaml#/report-version-return'
  /report-versions/{id}/publish:
    $ref: './paths/reports.yaml#/report-version-publish'
  /bookings/{id}/report:
    $ref: './paths/reports.yaml#/booking-report'
  /report-versions/{id}/download-url:
    $ref: './paths/reports.yaml#/report-version-download-url'
  /report-versions/{id}/share-links:
    $ref: './paths/reports.yaml#/report-version-share-links'
  /report-versions/{id}/share-links/{linkId}:
    $ref: './paths/reports.yaml#/report-version-share-link'
  # Platform
  /health:
    $ref: './paths/health.yaml#/health'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access JWT (EdDSA, 10 minutes; claims `sub`, `sid`, `amr`, `mfa_at`). A partial session
        (MFA still pending) is accepted only by `/auth/mfa/*` and `/auth/logout`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: lc_refresh
      description: >-
        Opaque rotating refresh token in an httpOnly, Secure, SameSite=Lax cookie scoped to the
        API domain. Accepted only by `/auth/refresh`.

