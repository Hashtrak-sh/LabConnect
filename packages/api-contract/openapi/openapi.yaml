components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access JWT (EdDSA, 10 minutes; claims `sub`, `sid`, `amr`, `mfa_at`). A partial session
        (MFA still pending) is accepted only by `/auth/mfa/*` and `/auth/logout`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: lc_refresh
      description: >-
        Opaque rotating refresh token in an httpOnly, Secure, SameSite=Lax cookie scoped to the
        API domain. Accepted only by `/auth/refresh`.

  # Every schema definition is registered here (by file, see the top of this file), so the bundle
  # and the generated types name it. Module files reference the component files directly.
  schemas:
    # Shared value types and references: components/schemas/common.yaml
    Uuid:
      $ref: './components/schemas/common.yaml#/Uuid'
    Date:
      $ref: './components/schemas/common.yaml#/Date'
    Timestamp:
      $ref: './components/schemas/common.yaml#/Timestamp'
    LocalTime:
      $ref: './components/schemas/common.yaml#/LocalTime'
