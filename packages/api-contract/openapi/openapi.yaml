openapi: 3.1.0
info:
  title: LabConnect API
  version: 0.1.0
  description: >-
    Contract-first REST API (ADR-003). Conventions: docs/04-api/API_CONVENTIONS.md. Errors:
    docs/04-api/ERROR_HANDLING.md (`application/problem+json`). Authentication:
    docs/04-api/AUTHENTICATION_AND_AUTHORISATION.md.


    This file is the root of a split contract. Paths live in `paths/<module>.yaml` and shared
    pieces in `components/`. `pnpm --filter @labconnect/api-contract generate` bundles them into
    one document and generates TypeScript types.

servers:
  - url: /v1
    description: Every route is under `/v1` on the API host.

tags:
  - name: Auth
    description: Email OTP sign-in, MFA, session refresh and sign-out.
  - name: Me
    description: The current user, organisation switching and notifications.
  - name: Discovery
    description: >-
      Public lab search, typeahead, filter values, lab site pages, slots and leads. No sign-in.
  - name: Verification
    description: Public report verification and share links. No sign-in.
  - name: Payments
    description: >-
      Payment orders, the gateway callback, the payment return status and financial documents.
  - name: Disputes
    description: Raising, following and withdrawing disputes on a booking.
  - name: Lab onboarding
    description: >-
      Lab claim, onboarding checklist, KYC documents, bank accounts, and lab users and
      invitations.
  - name: Lab sites
    description: >-
      Site settings of the lab: profile, receiving hours, closures, slot templates, slots,
      retention, scope-line availability and correction proposals.
  - name: Lab price lists
    description: Price-list drafts, bulk import with preview, and publication.
  - name: Lab inbox
    description: Bookings and approvals waiting for the lab's Makers and Checkers.
  - name: Custody
    description: >-
      QR and short-code scans at the lab counter, receipt records and their Checker decisions,
      label reprints.
  - name: Reports
    description: >-
      Report versions, review and publication, the report view, downloads and share links.
  - name: Customer
    description: >-
      The active customer organisation: profile, sites, settings, users and invitations.
  - name: Bookings
    description: >-
      Booking requests, lab decisions, counter-offers, cancellation, handover, hold decisions,
      testing status, timeline and ratings. Seen by both parties, each per role.
  - name: Health
    description: Platform liveness.

# Authenticated by default. Public operations override this with `security: []`.
security:
  - bearerAuth: []

