openapi: 3.1.0
info:
  title: LabConnect API
  version: 0.1.0
  description: >-
    Contract-first REST API (ADR-003). Conventions: docs/04-api/API_CONVENTIONS.md. Errors:
    docs/04-api/ERROR_HANDLING.md (`application/problem+json`). Authentication:
    docs/04-api/AUTHENTICATION_AND_AUTHORISATION.md.


    This file is the root of a split contract. Paths live in `paths/<module>.yaml` and shared
    pieces in `components/`. `pnpm --filter @labconnect/api-contract generate` bundles them into
    one document and generates TypeScript types.

servers:
  - url: /v1
    description: Every route is under `/v1` on the API host.

tags:
  - name: Auth
    description: Email OTP sign-in, MFA, session refresh and sign-out.
  - name: Me
    description: The current user, organisation switching and notifications.
  - name: Discovery
    description: >-
      Public lab search, typeahead, filter values, lab site pages, slots and leads. No sign-in.
  - name: Verification
    description: Public report verification and share links. No sign-in.
  - name: Payments
    description: >-
      Payment orders, the gateway callback, the payment return status and financial documents.
  - name: Disputes
    description: Raising, following and withdrawing disputes on a booking.
  - name: Health
    description: Platform liveness.

# Authenticated by default. Public operations override this with `security: []`.
security:
  - bearerAuth: []

paths:
  # Auth (API_CONTRACTS.md §1)
  /auth/otp/request:
    $ref: './paths/auth.yaml#/otp-request'
  /auth/otp/verify:
    $ref: './paths/auth.yaml#/otp-verify'
