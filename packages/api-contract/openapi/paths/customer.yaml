user:
  delete:
    operationId: deactivateCustomerUser
    tags:
      - Customer
    summary: Remove a user from the organisation
    description: >-
      Deactivates the membership (`id` is the membership id). The user loses access to the
      organisation at once: sessions acting as this membership are revoked (FR-IAM-06). Nothing
      is deleted. A membership that is already deactivated is left as it is. The user's open
      bookings stay with the organisation (EC-46). `CUSTOMER_ADMIN` only.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../components/schemas/common.yaml#/Uuid'
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    responses:
      '204':
        description: Deactivated.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: not a `CUSTOMER_ADMIN` of a customer organisation.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: '`NOT_FOUND`: no such membership in this organisation.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: '`VALIDATION_FAILED`.'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

