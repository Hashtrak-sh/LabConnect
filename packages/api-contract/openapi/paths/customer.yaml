    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/customer.yaml#/CustomerSettingsUpdate'
    responses:
      '200':
        description: Updated.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
          ETag:
            $ref: '../components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/customer.yaml#/CustomerSettings'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: not a `CUSTOMER_ADMIN` of a customer organisation.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: '`NOT_FOUND`: `X-Active-Membership` is not an active membership of this user.'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
        description: '`CONCURRENT_MODIFICATION`.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: >-
          `VALIDATION_FAILED` (including a `defaultCustomerSiteId` that is not an active site of
          the organisation).
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

users:
  get:
    operationId: listCustomerUsers
    tags:
      - Customer
    summary: List the organisation's users
    description: >-
      Members of the active membership's customer organisation, with their roles (FR-ONB-02).
      `CUSTOMER_ADMIN` only.
    parameters:
      - name: status
        in: query
        required: false
        description: Only memberships with this status.
        schema:
          $ref: '../components/schemas/enums.yaml#/MembershipStatus'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    responses:
      '200':
        description: A page of members.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/customer.yaml#/CustomerUserList'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: not a `CUSTOMER_ADMIN` of a customer organisation.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: '`NOT_FOUND`: `X-Active-Membership` is not an active membership of this user.'
      '422':
