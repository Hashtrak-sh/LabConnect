# Customer organisation (API_CONTRACTS.md §3, `/v1/customer`, FR-ONB-01..03).
# Every operation except the creation acts on the organisation of the caller's active
# membership (TENANT_ISOLATION.md §2): no organisation id is ever taken from the client. A caller
# whose active membership is not a customer membership gets 403. A site, user or invitation of
# another organisation is answered with 404.
# Each top-level key is one path item, referenced from openapi.yaml.

organisations:
  post:
    operationId: createCustomerOrganisation
    tags:
      - Customer
    summary: Create a customer organisation
    description: >-
      Customer self-sign-up (FR-ONB-01): an individual or an organisation (business, industry,
      government). Any signed-in user may call it; no membership is needed. The caller becomes the
      organisation's first `CUSTOMER_ADMIN`. The new membership appears in `GET /me`; switch to
      it with `POST /me/active-membership`. Platform staff cannot join a customer organisation
      (RR-5).
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
      - $ref: '../components/parameters.yaml#/RequestId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/customer.yaml#/CustomerOrganisationCreate'
    responses:
      '201':
        description: Created.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
          ETag:
            $ref: '../components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/customer.yaml#/CustomerOrganisation'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: the caller is platform staff (RR-5).'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
        description: '`REQUEST_IN_PROGRESS`.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: >-
          `VALIDATION_FAILED` (including a missing GSTIN for a non-individual segment, and a GSTIN
          that another customer organisation already uses), `IDEMPOTENCY_KEY_REUSED`.
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

organisation:
  get:
    operationId: getCustomerOrganisation
    tags:
      - Customer
    summary: Get the customer organisation
    description: The profile of the active membership's customer organisation. `CUSTOMER_ADMIN` only.
    parameters:
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    responses:
      '200':
        description: The organisation.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
          ETag:
            $ref: '../components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/customer.yaml#/CustomerOrganisation'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: not a `CUSTOMER_ADMIN` of a customer organisation.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: '`NOT_FOUND`: `X-Active-Membership` is not an active membership of this user.'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  patch:
    operationId: updateCustomerOrganisation
    tags:
      - Customer
    summary: Update the customer organisation
    description: >-
      Changes the profile and GSTIN of the active membership's customer organisation (FR-ONB-01).
      `CUSTOMER_ADMIN` only. Bookings already submitted are not changed.
    parameters:
      - $ref: '../components/parameters.yaml#/IfMatch'
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/customer.yaml#/CustomerOrganisationUpdate'
    responses:
      '200':
        description: Updated.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
          ETag:
            $ref: '../components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/customer.yaml#/CustomerOrganisation'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: not a `CUSTOMER_ADMIN` of a customer organisation.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: '`NOT_FOUND`: `X-Active-Membership` is not an active membership of this user.'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
        description: '`CONCURRENT_MODIFICATION`.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: >-
          `VALIDATION_FAILED` (including removing the GSTIN of a non-individual organisation, and
          a GSTIN that another customer organisation already uses).
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

sites:
  get:
    operationId: listCustomerSites
    tags:
      - Customer
    summary: List customer sites
    description: >-
      The sites of the active membership's customer organisation, by name (FR-ONB-03). Every
      member may read them, to choose a search location or the billing site of a booking; only a
      `CUSTOMER_ADMIN` changes them.
    parameters:
      - name: status
        in: query
        required: false
        description: Only sites with this status.
        schema:
          $ref: '../components/schemas/enums.yaml#/CustomerSiteStatus'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    responses:
      '200':
        description: A page of sites.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/customer.yaml#/CustomerSiteList'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: the active membership is not a customer membership.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: '`NOT_FOUND`: `X-Active-Membership` is not an active membership of this user.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: '`VALIDATION_FAILED` (for example an unreadable cursor).'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  post:
    operationId: createCustomerSite
    tags:
      - Customer
    summary: Add a customer site
    description: >-
      Adds a plant or office (FR-ONB-03). The address is geocoded after the site is saved.
      `CUSTOMER_ADMIN` only.
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/customer.yaml#/CustomerSiteCreate'
    responses:
      '201':
        description: Created.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
          ETag:
            $ref: '../components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/customer.yaml#/CustomerSite'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: not a `CUSTOMER_ADMIN` of a customer organisation.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: '`NOT_FOUND`: `X-Active-Membership` is not an active membership of this user.'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
        description: '`REQUEST_IN_PROGRESS`.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: '`VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REUSED`.'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

site:
  get:
    operationId: getCustomerSite
    tags:
      - Customer
    summary: Get a customer site
    description: One site of the active membership's customer organisation. Every member may read it.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../components/schemas/common.yaml#/Uuid'
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    responses:
      '200':
        description: The site.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
          ETag:
            $ref: '../components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/customer.yaml#/CustomerSite'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: the active membership is not a customer membership.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: '`NOT_FOUND`: no such site in this organisation.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: '`VALIDATION_FAILED`.'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
  patch:
    operationId: updateCustomerSite
    tags:
      - Customer
    summary: Update a customer site
    description: >-
      Changes a site, or retires it with `status: INACTIVE` (sites are never deleted). Bookings
      that already use the site keep it. `CUSTOMER_ADMIN` only.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../components/schemas/common.yaml#/Uuid'
      - $ref: '../components/parameters.yaml#/IfMatch'
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/customer.yaml#/CustomerSiteUpdate'
    responses:
      '200':
        description: Updated.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
          ETag:
            $ref: '../components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/customer.yaml#/CustomerSite'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: not a `CUSTOMER_ADMIN` of a customer organisation.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: '`NOT_FOUND`: no such site in this organisation.'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
        description: '`CONCURRENT_MODIFICATION`.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: '`VALIDATION_FAILED`.'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

