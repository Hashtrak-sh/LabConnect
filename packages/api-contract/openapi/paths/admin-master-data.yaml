              $ref: '../components/schemas/admin-master-data.yaml#/AdminChangeSetImpact'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: the caller is not `PLATFORM_DATA_STEWARD` or `PLATFORM_ADMIN`.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: '`NOT_FOUND`: no such change set.'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

record-versions:
  get:
    operationId: listAdminRecordVersions
    tags:
      - Admin Master Data
    summary: List the version history of a master record
    description: >-
      The published versions of one record, newest first (FR-MDM-03,
      VERSIONING_AND_SNAPSHOTS §1 pattern A), each with the change set that published it: who
      prepared and approved it, and its title. Roles: `PLATFORM_DATA_STEWARD`, `PLATFORM_OPS`.
