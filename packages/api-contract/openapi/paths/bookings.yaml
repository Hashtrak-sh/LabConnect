    summary: Decline the lab's counter-offer
    description: >-
      T-08 `DeclineCounter` (FR-LAB-03, EC-10). The booking becomes `EXPIRED` and the slot hold is
      released. Who: the owner only; the transition table names no other actor (OQ-37).
    x-transitions:
      - T-08
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
