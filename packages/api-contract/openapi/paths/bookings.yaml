custody-trail:
  get:
    operationId: getBookingCustodyTrail
    tags:
      - Bookings
    summary: Download the custody trail
    description: >-
      A PDF of the booking's chain of custody, to keep with the report (FR-RPT-11): issue, prints,
      scans, receipt and decisions, as in the customer's timeline. Available once the report has
      been released (`REPORT_RELEASED`, `DISPUTED`, `COMPLETED`). The download is logged. Who: the
      owner or a `CUSTOMER_ADMIN` of the organisation.
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    responses:
      '200':
        description: The custody trail.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
          Content-Disposition:
            description: '`attachment`, with a file name made from the booking number.'
            schema:
              type: string
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: neither the owner nor a `CUSTOMER_ADMIN` of the organisation.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: "`NOT_FOUND`: no such booking in the caller's scope."
      '409':
        $ref: '../components/responses.yaml#/Conflict'
        description: '`INVALID_STATE_TRANSITION`: the report has not been released yet.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: '`VALIDATION_FAILED`.'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

rating:
  post:
    operationId: rateBooking
    tags:
      - Bookings
    summary: Rate the other party
    description: >-
      FR-SUP-01. The owner rates the lab (`CUSTOMER_TO_LAB`); a `LAB_CHECKER` of the site rates
      the customer (`LAB_TO_CUSTOMER`), privately: the customer never sees it (TENANT_ISOLATION.md
      §1). The direction comes from the caller's side. One rating per direction, which cannot be
      changed. Only once the report has been released (`REPORT_RELEASED`, `DISPUTED`,
      `COMPLETED`).
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/bookings.yaml#/BookingRatingCreate'
    responses:
      '201':
        description: Rated.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/bookings.yaml#/BookingRating'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: "`FORBIDDEN`: neither the owner nor a `LAB_CHECKER` of the booking's site."
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: "`NOT_FOUND`: no such booking in the caller's scope."
      '409':
        $ref: '../components/responses.yaml#/Conflict'
        description: >-
          `INVALID_STATE_TRANSITION` (the report has not been released), `REQUEST_IN_PROGRESS`.
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: >-
          `VALIDATION_FAILED` (including a second rating in the same direction),
          `IDEMPOTENCY_KEY_REUSED`.
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
