      - `CANCEL`: T-27 `CancelBooking` from `ON_HOLD`, with `reasonCode`; refunded per BR-073.


      Guard: the hold case is open (also after it has been escalated to Ops, BR-047). Who: the
      owner or a `CUSTOMER_ADMIN` of the organisation.
    x-transitions:
