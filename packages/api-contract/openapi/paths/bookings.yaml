    summary: Decide on a booking on hold
    description: >-
      The customer's decision after the lab confirmed a discrepancy (FR-RPT-03, BR-046):


      - `PROCEED`: T-16 `CustomerProceed`. The booking becomes `RECEIVED` with a deviation flag
      (EC-33); the retention period counts from this decision (BR-049).

      - `REPLACE`: no state change. The customer brings a replacement or top-up sample (EC-25,
