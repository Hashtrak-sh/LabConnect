labels:
  get:
    operationId: getBookingLabels
    tags:
      - Bookings
    summary: Print the package labels
    description: >-
      A PDF of the booking's current package labels (QR_AND_VERIFICATION.md §2): QR, booking
      number, package n/N, short code and lab site name; nothing about the customer or the item.
      Every print is logged (`label_print`, custody event `LABELS_PRINTED`). This prints the
      current label versions only; a lab reprint, which voids a label, goes through
      `/packages/{id}/reprint-requests` (EC-26). Available while packages can still be dropped
      (`HANDOVER_SET`, `SAMPLE_RECORDED`, `ON_HOLD`). Who: the owner, or a `LAB_MAKER` or
      `LAB_CHECKER` of the site (CD-12, FR-LOG-04, FR-LOG-09).
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
      - name: format
        in: query
        required: false
        description: '`A4` sticker sheet or `THERMAL_50x25` (50 × 25 mm thermal labels).'
        schema:
          type: string
          enum:
            - A4
            - THERMAL_50x25
          default: A4
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    responses:
      '200':
        description: The label sheet.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
          Content-Disposition:
            description: '`attachment`, with a file name made from the booking number.'
            schema:
              type: string
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: neither the owner nor a `LAB_MAKER` or `LAB_CHECKER` of the site.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: "`NOT_FOUND`: no such booking in the caller's scope."
      '409':
        $ref: '../components/responses.yaml#/Conflict'
        description: '`INVALID_STATE_TRANSITION`: there are no labels to print in this state.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: '`VALIDATION_FAILED`.'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

hold-decision:
  post:
    operationId: decideBookingHold
    tags:
