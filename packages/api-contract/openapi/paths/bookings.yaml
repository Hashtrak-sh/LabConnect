          ETag:
            $ref: '../components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/bookings.yaml#/BookingView'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: '`FORBIDDEN`: not the owner of the booking.'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: "`NOT_FOUND`: no such booking in the caller's scope."
      '409':
        $ref: '../components/responses.yaml#/Conflict'
        description: '`INVALID_STATE_TRANSITION` (not `COUNTERED`), `REQUEST_IN_PROGRESS`.'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
        description: '`CONCURRENT_MODIFICATION`.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: '`IDEMPOTENCY_KEY_REUSED`.'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

cancel:
  post:
    operationId: cancelBooking
    tags:
      - Bookings
    summary: Cancel a booking
    description: >-
      `CancelBooking`, by state (BOOKING_STATE_MACHINE.md §3):


      - T-25 from `REQUESTED`, `COUNTERED` or `ACCEPTED`: free (BR-070, FR-BKG-07). Who: the
      owner or a `CUSTOMER_ADMIN`.

      - T-26 from `HANDOVER_SET`: refund of the total minus the cancellation fee when the
      customer cancels (BR-071, EC-18), in full when the lab cancels (BR-074, EC-20; a lab
      penalty is recorded). Who: the owner, a `CUSTOMER_ADMIN`, or a `LAB_CHECKER` of the site.

      - T-27 from `SAMPLE_RECORDED`, `ON_HOLD`, `RECEIVED` or `UNDER_TEST`: lines `NOT_STARTED`
      are refunded, lines in progress or done are not (BR-073, EC-19), using the line statuses
      the lab has recorded; in full when the lab cancels (BR-074). Who: as T-26.


      The slot hold is released. Refunds are made by the payments module. Allowed on a frozen
      booking (EC-01). Not allowed from `REPORT_IN_REVIEW` or later (OQ-24). Ops cancels through
      `/admin/bookings/{id}/cancel`.
    x-transitions:
      - T-25
      - T-26
      - T-27
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
      - $ref: '../components/parameters.yaml#/IfMatch'
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/bookings.yaml#/BookingCancelRequest'
    responses:
      '200':
        description: Cancelled.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
          ETag:
            $ref: '../components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/bookings.yaml#/BookingView'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: >-
          `FORBIDDEN`: the caller may not cancel in this state (for example a `LAB_CHECKER`
          before handover, or a `CUSTOMER_REQUESTER` who is not the owner).
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: "`NOT_FOUND`: no such booking in the caller's scope."
      '409':
        $ref: '../components/responses.yaml#/Conflict'
        description: '`INVALID_STATE_TRANSITION` (the state cannot be cancelled), `REQUEST_IN_PROGRESS`.'
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
        description: '`CONCURRENT_MODIFICATION`.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: >-
          `VALIDATION_FAILED` (including an unknown or inactive reason code),
          `IDEMPOTENCY_KEY_REUSED`.
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

handover:
  get:
    operationId: getBookingHandover
    tags:
      - Bookings
    summary: Get the handover instructions and QR codes
    description: >-
      Self-drop instructions for a paid booking (FR-LOG-02, FR-LOG-04): the lab address and pin,
      receiving hours, the lab's contact, submission instructions, the drop deadline (BR-040), the
      booking QR and one QR per package (FR-LOG-03). Available once the QR codes have been issued
      (T-11, `HANDOVER_SET`) and afterwards. Who: the owner, a `CUSTOMER_ADMIN`, or a
      `LAB_MAKER` or `LAB_CHECKER` of the site (ROLES_AND_PERMISSIONS §2).
