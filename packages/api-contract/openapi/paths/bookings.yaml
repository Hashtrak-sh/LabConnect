line-status:
  post:
    operationId: setBookingLineStatus
    tags:
      - Bookings
    summary: Set the status of a booking line
    description: >-
      Moves one line along its sub-state machine (BOOKING_STATE_MACHINE.md §4): `NOT_STARTED →
      IN_PROGRESS → DONE`, or `CANCELLED` from `NOT_STARTED` or `IN_PROGRESS` by agreement, with
      a reason (partial cancellation, EC-19, EC-34, EC-36). Not a booking transition: the booking
      total is not restated; a cancelled line is refunded by the payments module (BR-073). These
      statuses also decide the refund when the booking is cancelled under T-27. Only while the
      booking is `ON_HOLD`, `RECEIVED` or `UNDER_TEST`. `If-Match` carries the booking's `ETag`.
      Who: a `LAB_MAKER` assigned to the booking's site.
    parameters:
      - $ref: '../components/parameters.yaml#/PathId'
      - name: lineId
        in: path
        required: true
        schema:
          $ref: '../components/schemas/common.yaml#/Uuid'
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
      - $ref: '../components/parameters.yaml#/IfMatch'
      - $ref: '../components/parameters.yaml#/ActiveMembership'
      - $ref: '../components/parameters.yaml#/RequestId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/bookings.yaml#/BookingLineStatusChange'
    responses:
      '200':
        description: Changed. The whole booking is returned.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yaml#/RequestId'
          ETag:
            $ref: '../components/headers.yaml#/ETag'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/bookings.yaml#/BookingView'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthenticated'
        description: '`UNAUTHENTICATED`.'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
        description: "`FORBIDDEN`: not a `LAB_MAKER` of the booking's site."
      '404':
        $ref: '../components/responses.yaml#/NotFound'
        description: "`NOT_FOUND`: no such booking in the caller's scope, or no such line in it."
      '409':
        $ref: '../components/responses.yaml#/Conflict'
        description: >-
          `INVALID_STATE_TRANSITION` (the line cannot move to that status, or the booking is not
          in a state where lines change), `REQUEST_IN_PROGRESS`.
      '412':
        $ref: '../components/responses.yaml#/PreconditionFailed'
        description: '`CONCURRENT_MODIFICATION`.'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
        description: >-
          `VALIDATION_FAILED` (including `CANCELLED` without a reason), `IDEMPOTENCY_KEY_REUSED`.
      '429':
        $ref: '../components/responses.yaml#/TooManyRequests'
        description: '`RATE_LIMITED`.'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

