# Pieces shared by the admin module (API_CONTRACTS.md §10): pre-signed upload and download URLs
# (FILES_AND_REPORTS.md §1 and §2). Admin responses never carry a file's bucket or object key.

AdminImportFileContentType:
  type: string
  description: >-
    Declared content type of an import file. Import files (`IMPORT_SOURCE`) are CSV or XLSX
    (FILES_AND_REPORTS §1).
  enum:
    - text/csv
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

AdminUploadUrlRequest:
  type: object
  description: >-
    Asks for a pre-signed upload URL for one import file (FILES_AND_REPORTS §1, step 1). The API
    checks the role, the size limit and the type allow-list, and records the file as `PENDING`
    until the malware scan and validation have passed.
  required:
    - fileName
    - contentType
    - sizeBytes
  additionalProperties: false
  properties:
    fileName:
      type: string
      minLength: 1
      maxLength: 255
      description: The original file name. It is sanitised before it is stored.
    contentType:
      $ref: '#/AdminImportFileContentType'
    sizeBytes:
      type: integer
      format: int64
      minimum: 1
      maximum: 52428800
      description: Size of the file in bytes. Import files are at most 50 MB.

AdminUploadUrl:
  type: object
  description: >-
    A pre-signed PUT to the quarantine area, valid for 15 minutes. The client uploads the file
    straight to storage with exactly the declared `Content-Type` and size. The file can be used
    by a command only once its scan is clean (`FILE_NOT_CLEAN` otherwise).
  required:
    - fileId
    - uploadUrl
    - expiresAt
  additionalProperties: false
  properties:
    fileId:
      $ref: './common.yaml#/Uuid'
    uploadUrl:
      type: string
      format: uri
    expiresAt:
      $ref: './common.yaml#/Timestamp'

AdminDownloadUrl:
  type: object
  description: >-
    A pre-signed GET valid for 15 minutes, served with `Content-Disposition: attachment`
    (FILES_AND_REPORTS §2). Issuing it is logged.
  required:
    - url
    - expiresAt
  additionalProperties: false
  properties:
    url:
      type: string
      format: uri
    expiresAt:
      $ref: './common.yaml#/Timestamp'
