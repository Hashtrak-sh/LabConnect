# Enumerations that also exist in the database (packages/database/prisma/schema/enums.prisma).
# The names and values must match the Prisma enums exactly; the test suite checks this.

RoleCode:
  type: string
  description: A role held through a membership (ROLES_AND_PERMISSIONS.md §1).
  enum:
    - CUSTOMER_ADMIN
    - CUSTOMER_REQUESTER
    - CUSTOMER_FINANCE
    - LAB_MAKER
    - LAB_CHECKER
    - PLATFORM_OPS
    - PLATFORM_DATA_STEWARD
    - PLATFORM_FINANCE
    - PLATFORM_ADMIN

OrgType:
  type: string
  enum:
    - CUSTOMER
    - LAB
    - PLATFORM

NotifChannel:
  type: string
  description: >-
    Notification channel. The MVP sends `EMAIL` and `IN_APP` only; `SMS` and `WHATSAPP` exist for
    later channels (CD-35).
  enum:
    - EMAIL
    - IN_APP
    - SMS
    - WHATSAPP

AccreditationStatus:
  type: string
  description: >-
    Status of an accreditation (SCHEMA_SPECIFICATION §5.3). Sites with a `SUSPENDED`, `WITHDRAWN`
    or `EXPIRED` accreditation are removed from search results (BR-002).
  enum:
    - VALID
    - SUSPENDED
    - WITHDRAWN
    - EXPIRED

PublicLabCategory:
  type: string
  description: >-
    Lab category of an accreditation, as shown publicly. A subset of the database enum
    `LabCategory`: `MEDICAL` (ISO 15189) is rejected at import and never shown (CD-03, BR-005).
    Only `TESTING` is bookable; `CALIBRATION` is listed and searchable but not bookable.
  enum:
    - TESTING
    - CALIBRATION
    - OTHER

PublicListingStatus:
  type: string
  description: >-
    Listing status of a lab site, as shown publicly. A subset of the database enum
    `ListingStatus`: `HIDDEN` sites are never returned. `LISTED` sites can be found but not booked
    (for example unclaimed labs, CD-04); `BOOKABLE` sites meet BR-001.
  enum:
    - LISTED
    - BOOKABLE

ScopeSiteType:
  type: string
  description: Where the lab performs the test, as published in the scope (SCHEMA_SPECIFICATION §5.5).
  enum:
    - PERMANENT
    - SITE
    - MOBILE

LeadKind:
  type: string
  description: >-
    `REQUEST_LAB`: "Request this lab" on a listed site that cannot be booked yet (FR-DAT-06,
    AC-DIS-04). `NO_RESULT`: "Request a lab" when a search has no result (FR-DIS-07, EC-05).
  enum:
    - REQUEST_LAB
    - NO_RESULT

VerificationResult:
  type: string
  description: >-
    Result of a public report verification (QR_AND_VERIFICATION §5): genuine and current, genuine
    but superseded by a newer version, not found, or revoked.
  enum:
    - GENUINE_CURRENT
    - GENUINE_SUPERSEDED
    - NOT_FOUND
    - REVOKED

# ---------------------------------------------------------------------------------------------
# P2-06b (admin, API_CONTRACTS.md §10). Enums named like a Prisma enum mirror it exactly; the
# `Admin…` enums are documented subsets of one.

BookingStatus:
  type: string
  description: Booking status (BOOKING_STATE_MACHINE.md §1).
  enum:
    - REQUESTED
    - COUNTERED
    - ACCEPTED
    - PAID
    - HANDOVER_SET
    - SAMPLE_RECORDED
    - ON_HOLD
    - RECEIVED
    - UNDER_TEST
    - REPORT_IN_REVIEW
    - REPORT_RELEASED
    - DISPUTED
    - COMPLETED
    - REJECTED
    - EXPIRED
    - EXPIRED_UNPAID
    - NO_SHOW
    - CANCELLED

BookingLineStatus:
  type: string
  description: Status of a booking line (BOOKING_STATE_MACHINE.md §4).
  enum:
    - NOT_STARTED
    - IN_PROGRESS
    - DONE
    - CANCELLED

PartyType:
  type: string
  description: Which party acted (booking cancellation, dispute raiser, refund initiator).
  enum:
    - CUSTOMER
    - LAB
    - PLATFORM
    - SYSTEM

ReportStatus:
  type: string
  description: Status of a booking's report (SCHEMA_SPECIFICATION §9.1).
  enum:
    - IN_PROGRESS
    - RELEASED
    - AMENDMENT_IN_PROGRESS

ReportVersionStatus:
  type: string
  description: Status of a report version (BOOKING_STATE_MACHINE.md §4).
  enum:
    - DRAFT
    - IN_REVIEW
    - RETURNED
    - RELEASED
    - SUPERSEDED

TimerType:
  type: string
  description: A booking deadline or reminder (AUDIT_AND_EVENT_ARCHITECTURE.md §4).
  enum:
    - LAB_DECISION_REMINDER_50
    - LAB_DECISION_REMINDER_90
    - LAB_DECISION_DUE
    - COUNTER_RESPONSE_DUE
    - PAYMENT_REMINDER
    - PAYMENT_DUE
    - DROP_REMINDER
    - DROP_DEADLINE
    - NO_SHOW_DUE
    - RECEIPT_APPROVAL_REMINDER
    - HOLD_DECISION_DUE
    - REPORT_DUE
    - REPORT_APPROVAL_REMINDER
    - DISPUTE_WINDOW_END
    - PAYMENT_RECONCILE

ClaimMethod:
  type: string
  description: >-
    How a lab claim is verified (FR-DAT-07): OTP to the NABL-registered email, or a letterhead
    authorisation reviewed by Ops.
  enum:
    - EMAIL_OTP
    - MANUAL

ClaimRequestStatus:
  type: string
  enum:
    - PENDING_OTP
    - PENDING_REVIEW
    - APPROVED
    - REJECTED
    - EXPIRED

VerificationStatus:
  type: string
  description: Verification state of a KYC document, a bank account or an organisation's KYC.
  enum:
    - NOT_STARTED
    - SUBMITTED
    - VERIFIED
    - REJECTED

AdminVerificationDecision:
  type: string
  description: >-
    The decision of a KYC or bank verification. A subset of the database enum
    `VerificationStatus`.
  enum:
    - VERIFIED
    - REJECTED

GeocodeStatus:
  type: string
  description: >-
    Geocoding state of a lab site (MAPS_AND_GEOCODING §3). `LOW_CONFIDENCE` sites wait in the Ops
    pin queue; `MANUAL_APPROVED` is a pin Ops approved.
  enum:
    - PENDING
    - AUTO_OK
    - LOW_CONFIDENCE
    - MANUAL_APPROVED

AdminGeocodeQueueStatus:
  type: string
  description: >-
    The geocode states that put a site in the Ops pin queue. A subset of the database enum
    `GeocodeStatus`.
  enum:
    - PENDING
    - LOW_CONFIDENCE

MdStatus:
  type: string
  description: >-
    Active or inactive. Master data, templates and other configuration are never deleted; they
    are deactivated.
  enum:
    - ACTIVE
    - INACTIVE

MdDataType:
  type: string
  description: Data type of a master-data attribute (SCHEMA_SPECIFICATION §4.3).
  enum:
    - STRING
    - INTEGER
    - DECIMAL
    - BOOLEAN
    - DATE
    - ENUM
    - NODE_REF
    - STRING_ARRAY

ChangeSource:
  type: string
  description: >-
    Where a change set comes from. `NABL_SYNC` is deferred (FR-MDM-10); `LAB_PROPOSAL` sets come
    from a lab Checker (EC-04).
  enum:
    - MANUAL
    - IMPORT
    - LAB_PROPOSAL
    - NABL_SYNC

ChangeSetStatus:
  type: string
  description: Change-set lifecycle (MASTER_DATA_MANAGEMENT.md §3).
  enum:
    - DRAFT
    - IN_REVIEW
    - APPROVED
    - PUBLISHED
    - REJECTED
    - CANCELLED

MdTargetType:
  type: string
  description: >-
    The kind of record a change item changes. Each kind keeps its published history in a version
    table (VERSIONING_AND_SNAPSHOTS.md §1, pattern A).
  enum:
    - MD_NODE
    - LAB_ORG
    - LAB_SITE
    - ACCREDITATION
    - SCOPE_LINE
    - SYNONYM

ChangeOperation:
  type: string
  description: What a change item does. Records are never deleted, only deactivated.
  enum:
    - CREATE
    - UPDATE
    - DEACTIVATE
    - REACTIVATE

ValidationStatus:
  type: string
  enum:
    - VALID
    - WARNING
    - ERROR

ImportKind:
  type: string
  description: >-
    What an import loads. `LAB_PRICE_LIST` imports belong to the lab and are not reviewed by the
    platform (CD-06).
  enum:
    - NABL_LABS
    - NABL_SCOPE
    - TAXONOMY_NODES
    - LAB_PRICE_LIST

ImportStatus:
  type: string
  enum:
    - UPLOADED
    - PARSING
    - PREVIEW_READY
    - FAILED
    - COMMITTED
    - DISCARDED

ImportSourceFormat:
  type: string
  enum:
    - CSV
    - XLSX

ImportMatchResult:
  type: string
  description: How an import row matched existing records (MASTER_DATA_MANAGEMENT.md §4 step 5).
  enum:
    - NEW
    - MATCHED
    - DUPLICATE_IN_FILE
    - CONFLICT

ImportRowAction:
  type: string
  description: What committing the import would do with the row (FR-MDM-05).
  enum:
    - CREATE
    - UPDATE
    - NO_CHANGE
    - SKIP
    - ERROR

LeadStatus:
  type: string
  enum:
    - NEW
    - IN_PROGRESS
    - CLOSED_ONBOARDED
    - CLOSED_NO_ACTION

DisputeStatus:
  type: string
  description: >-
    Status of a dispute. The life cycle is not fully stated yet (OQ-38); the contract does not
    encode transitions beyond the ones its operations describe.
  enum:
    - OPEN
    - AWAITING_LAB
    - AWAITING_CUSTOMER
    - UNDER_REVIEW
    - DECIDED
    - CLOSED
    - WITHDRAWN

DisputeOutcome:
  type: string
  description: >-
    The commercial outcome Ops decides (CD-14, FR-SUP-03). Technical result disputes are referred
    to the lab's own complaint process (BR-082).
  enum:
    - NO_ACTION
    - PARTIAL_REFUND
    - FULL_REFUND
    - REPORT_AMENDMENT_REQUIRED
    - REFERRED_TO_LAB_COMPLAINT_PROCESS

RefundStatus:
  type: string
  enum:
    - REQUESTED
    - APPROVED
    - SUBMITTED
    - SUCCEEDED
    - FAILED

PayoutStatus:
  type: string
  description: >-
    Status of a payout batch. The life cycle is not fully stated yet (OQ-38).
  enum:
    - PENDING
    - ON_HOLD
    - ELIGIBLE
    - RELEASED
    - FAILED
    - CANCELLED

PayoutMechanism:
  type: string
  description: >-
    How a payout reaches the lab. Undecided (ADR-009, OQ-01, OQ-02): `TBD` until then.
  enum:
    - GATEWAY_SETTLEMENT
    - BANK_TRANSFER_MANUAL
    - TBD

PayoutHoldReason:
  type: string
  description: >-
    Why a booking's payout is held. `DISPUTE` holds are placed automatically when a dispute is
    raised (BR-078).
  enum:
    - DISPUTE
    - OPS_MANUAL
    - COMPLIANCE

AdminPayoutHoldPlaceReason:
  type: string
  description: >-
    The reasons platform staff can place a hold with. A subset of the database enum
    `PayoutHoldReason`: `DISPUTE` holds are placed only by raising a dispute.
  enum:
    - OPS_MANUAL
    - COMPLIANCE

GatewayCode:
  type: string
  description: >-
    Payment gateway adapter. `FAKE` is the test adapter; ICICI details are unknown until OQ-01
    is answered.
  enum:
    - ICICI
    - FAKE

SettlementMatchStatus:
  type: string
  enum:
    - MATCHED
    - UNMATCHED
    - MISMATCH

ConfigScope:
  type: string
  description: The scope a configuration value applies to. `scopeId` is null for `GLOBAL`.
  enum:
    - GLOBAL
    - LAB_ORG
    - LAB_SITE
    - CATEGORY

UserStatus:
  type: string
  enum:
    - INVITED
    - ACTIVE
    - DISABLED

AdminUserStatusUpdate:
  type: string
  description: >-
    The statuses an administrator can set on a platform user. A subset of the database enum
    `UserStatus`. Users are deactivated (`DISABLED`), never deleted.
  enum:
    - ACTIVE
    - DISABLED

AdminPlatformRoleCode:
  type: string
  description: >-
    A platform role (ROLES_AND_PERMISSIONS.md §1, ADR-012). A subset of the database enum
    `RoleCode`. Platform roles never combine with customer or lab roles (RR-5).
  enum:
    - PLATFORM_OPS
    - PLATFORM_DATA_STEWARD
    - PLATFORM_FINANCE
    - PLATFORM_ADMIN
