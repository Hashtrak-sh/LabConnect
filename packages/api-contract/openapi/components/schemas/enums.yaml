# Enumerations that also exist in the database (packages/database/prisma/schema/enums.prisma).
# The names and values must match the Prisma enums exactly; the test suite checks this.

RoleCode:
  type: string
  description: A role held through a membership (ROLES_AND_PERMISSIONS.md §1).
  enum:
    - CUSTOMER_ADMIN
    - CUSTOMER_REQUESTER
    - CUSTOMER_FINANCE
    - LAB_MAKER
    - LAB_CHECKER
    - PLATFORM_OPS
    - PLATFORM_DATA_STEWARD
    - PLATFORM_FINANCE
    - PLATFORM_ADMIN

OrgType:
  type: string
  enum:
    - CUSTOMER
    - LAB
    - PLATFORM

NotifChannel:
  type: string
  description: >-
    Notification channel. The MVP sends `EMAIL` and `IN_APP` only; `SMS` and `WHATSAPP` exist for
    later channels (CD-35).
  enum:
    - EMAIL
    - IN_APP
    - SMS
    - WHATSAPP

AccreditationStatus:
  type: string
  description: >-
    Status of an accreditation (SCHEMA_SPECIFICATION §5.3). Sites with a `SUSPENDED`, `WITHDRAWN`
    or `EXPIRED` accreditation are removed from search results (BR-002).
  enum:
    - VALID
    - SUSPENDED
    - WITHDRAWN
    - EXPIRED

PublicLabCategory:
  type: string
  description: >-
    Lab category of an accreditation, as shown publicly. A subset of the database enum
    `LabCategory`: `MEDICAL` (ISO 15189) is rejected at import and never shown (CD-03, BR-005).
    Only `TESTING` is bookable; `CALIBRATION` is listed and searchable but not bookable.
  enum:
    - TESTING
    - CALIBRATION
    - OTHER

PublicListingStatus:
  type: string
  description: >-
    Listing status of a lab site, as shown publicly. A subset of the database enum
    `ListingStatus`: `HIDDEN` sites are never returned. `LISTED` sites can be found but not booked
    (for example unclaimed labs, CD-04); `BOOKABLE` sites meet BR-001.
  enum:
    - LISTED
    - BOOKABLE

ScopeSiteType:
  type: string
  description: Where the lab performs the test, as published in the scope (SCHEMA_SPECIFICATION §5.5).
  enum:
    - PERMANENT
    - SITE
    - MOBILE

LeadKind:
  type: string
  description: >-
    `REQUEST_LAB`: "Request this lab" on a listed site that cannot be booked yet (FR-DAT-06,
    AC-DIS-04). `NO_RESULT`: "Request a lab" when a search has no result (FR-DIS-07, EC-05).
  enum:
    - REQUEST_LAB
    - NO_RESULT

VerificationResult:
  type: string
  description: >-
    Result of a public report verification (QR_AND_VERIFICATION §5): genuine and current, genuine
    but superseded by a newer version, not found, or revoked.
  enum:
    - GENUINE_CURRENT
    - GENUINE_SUPERSEDED
    - NOT_FOUND
    - REVOKED

# --- P2-05: custody, receipt and reports (API_CONTRACTS.md §7 and §8) ---

BookingStatus:
  type: string
  description: >-
    Status of a booking (BOOKING_STATE_MACHINE §1). Only the BookingEngine changes it, through the
    transitions T-01 to T-28.
  enum:
    - REQUESTED
    - COUNTERED
    - ACCEPTED
    - PAID
    - HANDOVER_SET
    - SAMPLE_RECORDED
    - ON_HOLD
    - RECEIVED
    - UNDER_TEST
    - REPORT_IN_REVIEW
    - REPORT_RELEASED
    - DISPUTED
    - COMPLETED
    - REJECTED
    - EXPIRED
    - EXPIRED_UNPAID
    - NO_SHOW
    - CANCELLED

BookingLineStatus:
  type: string
  description: >-
    Status of a booking line (BOOKING_STATE_MACHINE §4). A `CANCELLED` line cannot carry a report
    result (BR-061).
  enum:
    - NOT_STARTED
    - IN_PROGRESS
    - DONE
    - CANCELLED

PackageStatus:
  type: string
  description: >-
    Status of one package label (BOOKING_STATE_MACHINE §4): `ISSUED → RECEIVED | MISSING |
    VOIDED`. A reprint voids the label and issues a new `ISSUED` label version (BR-044).
  enum:
    - ISSUED
    - RECEIVED
    - MISSING
    - VOIDED

CustodyScanEventType:
  type: string
  description: >-
    The custody event a successful counter scan writes (QR_AND_VERIFICATION §3). A subset of the
    database enum `CustodyEventType`: `SCAN_ACCEPTED` for a QR scan, `MANUAL_LOOKUP` for the
    short-code fallback (a photo is then required with the receipt). A refused scan writes
    `SCAN_REJECTED` and is answered with an error.
  enum:
    - SCAN_ACCEPTED
    - MANUAL_LOOKUP

ReceiptDecision:
  type: string
  description: >-
    The Checker's decision on a receipt record (BOOKING_STATE_MACHINE §4): approved (T-14),
    discrepancy confirmed (T-15) or sample rejected as unfit (T-28). `null` while the record waits
    for a Checker.
  enum:
    - APPROVED
    - HOLD_CONFIRMED
    - REJECTED_UNFIT

ReportStatus:
  type: string
  description: >-
    Status of a booking's report across its versions (SCHEMA_SPECIFICATION §9.1).
  enum:
    - IN_PROGRESS
    - RELEASED
    - AMENDMENT_IN_PROGRESS

ReportVersionStatus:
  type: string
  description: >-
    Status of one report version (BOOKING_STATE_MACHINE §4, FILES_AND_REPORTS §3): `DRAFT →
    IN_REVIEW → RETURNED | RELEASED`, `RELEASED → SUPERSEDED`. A released version is immutable; a
    correction is a new version.
  enum:
    - DRAFT
    - IN_REVIEW
    - RETURNED
    - RELEASED
    - SUPERSEDED

ConformityResult:
  type: string
  description: >-
    Statement of conformity for one booked parameter in a report version (FR-RPT-05,
    SCHEMA_SPECIFICATION §9.3).
  enum:
    - CONFORMS
    - DOES_NOT_CONFORM
    - NOT_STATED
    - NOT_APPLICABLE
