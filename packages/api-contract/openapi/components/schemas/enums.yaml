# Enumerations that also exist in the database (packages/database/prisma/schema/enums.prisma).
# The names and values must match the Prisma enums exactly; the test suite checks this.

RoleCode:
  type: string
  description: A role held through a membership (ROLES_AND_PERMISSIONS.md §1).
  enum:
    - CUSTOMER_ADMIN
    - CUSTOMER_REQUESTER
    - CUSTOMER_FINANCE
    - LAB_MAKER
    - LAB_CHECKER
    - PLATFORM_OPS
    - PLATFORM_DATA_STEWARD
    - PLATFORM_FINANCE
    - PLATFORM_ADMIN

OrgType:
  type: string
  enum:
    - CUSTOMER
    - LAB
    - PLATFORM

NotifChannel:
  type: string
  description: >-
    Notification channel. The MVP sends `EMAIL` and `IN_APP` only; `SMS` and `WHATSAPP` exist for
    later channels (CD-35).
  enum:
    - EMAIL
    - IN_APP
    - SMS
    - WHATSAPP

AccreditationStatus:
  type: string
  description: >-
    Status of an accreditation (SCHEMA_SPECIFICATION §5.3). Sites with a `SUSPENDED`, `WITHDRAWN`
    or `EXPIRED` accreditation are removed from search results (BR-002).
  enum:
    - VALID
    - SUSPENDED
    - WITHDRAWN
    - EXPIRED

PublicLabCategory:
  type: string
  description: >-
    Lab category of an accreditation, as shown publicly. A subset of the database enum
    `LabCategory`: `MEDICAL` (ISO 15189) is rejected at import and never shown (CD-03, BR-005).
    Only `TESTING` is bookable; `CALIBRATION` is listed and searchable but not bookable.
  enum:
    - TESTING
    - CALIBRATION
    - OTHER

PublicListingStatus:
  type: string
  description: >-
    Listing status of a lab site, as shown publicly. A subset of the database enum
    `ListingStatus`: `HIDDEN` sites are never returned. `LISTED` sites can be found but not booked
    (for example unclaimed labs, CD-04); `BOOKABLE` sites meet BR-001.
  enum:
    - LISTED
    - BOOKABLE

ScopeSiteType:
  type: string
  description: Where the lab performs the test, as published in the scope (SCHEMA_SPECIFICATION §5.5).
  enum:
    - PERMANENT
    - SITE
    - MOBILE

LeadKind:
  type: string
  description: >-
    `REQUEST_LAB`: "Request this lab" on a listed site that cannot be booked yet (FR-DAT-06,
    AC-DIS-04). `NO_RESULT`: "Request a lab" when a search has no result (FR-DIS-07, EC-05).
  enum:
    - REQUEST_LAB
    - NO_RESULT

VerificationResult:
  type: string
  description: >-
    Result of a public report verification (QR_AND_VERIFICATION §5): genuine and current, genuine
    but superseded by a newer version, not found, or revoked.
  enum:
    - GENUINE_CURRENT
    - GENUINE_SUPERSEDED
    - NOT_FOUND
    - REVOKED

# P2-03: customer organisation and bookings (API_CONTRACTS.md §3 and §4).

CustomerSegment:
  type: string
  description: >-
    Kind of customer organisation (FR-ONB-01, CD-02). `INDIVIDUAL` is a person booking for
    themselves; the others are organisations.
  enum:
    - INDIVIDUAL
    - BUSINESS
    - INDUSTRY
    - GOVERNMENT

OrgStatus:
  type: string
  enum:
    - ACTIVE
    - SUSPENDED
    - CLOSED

MembershipStatus:
  type: string
  description: >-
    `INVITED` until the user accepts, `ACTIVE`, or `DEACTIVATED` (access is lost at once,
    FR-IAM-06).
  enum:
    - INVITED
    - ACTIVE
    - DEACTIVATED

CustomerRoleCode:
  type: string
  description: >-
    The roles of a customer organisation (CD-21). A subset of the database enum `RoleCode`. One
    user may hold several of them (RR-1).
  enum:
    - CUSTOMER_ADMIN
    - CUSTOMER_REQUESTER
    - CUSTOMER_FINANCE

CustomerSiteStatus:
  type: string
  description: >-
    Status of a customer site (`customer_site.status`, database enum `MdStatus`). An `INACTIVE`
    site cannot be chosen for a new booking; bookings that already use it keep it.
  enum:
    - ACTIVE
    - INACTIVE

BookingStatus:
  type: string
  description: >-
    Booking state (BOOKING_STATE_MACHINE.md §1). `PAID` is transient: the system moves the booking
    to `HANDOVER_SET` at once. `COMPLETED`, `REJECTED`, `EXPIRED`, `EXPIRED_UNPAID`, `NO_SHOW` and
    `CANCELLED` are terminal.
  enum:
    - REQUESTED
    - COUNTERED
    - ACCEPTED
    - PAID
    - HANDOVER_SET
    - SAMPLE_RECORDED
    - ON_HOLD
    - RECEIVED
    - UNDER_TEST
    - REPORT_IN_REVIEW
    - REPORT_RELEASED
    - DISPUTED
    - COMPLETED
    - REJECTED
    - EXPIRED
    - EXPIRED_UNPAID
    - NO_SHOW
    - CANCELLED

BookingLineStatus:
  type: string
  description: >-
    Status of one booking line (BOOKING_STATE_MACHINE.md §4): `NOT_STARTED → IN_PROGRESS → DONE`,
    or `CANCELLED` from `NOT_STARTED` or `IN_PROGRESS`.
  enum:
    - NOT_STARTED
    - IN_PROGRESS
    - DONE
    - CANCELLED

PartyType:
  type: string
  description: The side that acted. `SYSTEM` is a timer, a worker or another module.
  enum:
    - CUSTOMER
    - LAB
    - PLATFORM
    - SYSTEM

CounterStatus:
  type: string
  enum:
    - PENDING
    - ACCEPTED
    - DECLINED
    - EXPIRED
    - WITHDRAWN

HoldDecision:
  type: string
  description: >-
    The customer's decision on a booking `ON_HOLD` (FR-RPT-03, EC-25, EC-29, EC-33, EC-34):
    proceed as received (T-16), bring a replacement or top-up sample, or cancel (T-27).
  enum:
    - PROCEED
    - REPLACE
    - CANCEL

HoldStatus:
  type: string
  description: >-
    `OPEN` while the customer decides, `ESCALATED` to Ops when the window lapses without a decision
    (BR-047; never cancelled automatically), `DECIDED`, then `CLOSED`.
  enum:
    - OPEN
    - DECIDED
    - ESCALATED
    - CLOSED

PackageStatus:
  type: string
  description: >-
    Status of a labelled package (BOOKING_STATE_MACHINE.md §4). A reprint voids the label
    (`VOIDED`) and issues a new label version.
  enum:
    - ISSUED
    - RECEIVED
    - MISSING
    - VOIDED

CustodyEventType:
  type: string
  description: An event in the chain of custody of a booking's packages (`custody_event`).
  enum:
    - QR_ISSUED
    - LABELS_PRINTED
    - LABEL_REPRINTED
    - LABEL_VOIDED
    - SCAN_ACCEPTED
    - SCAN_REJECTED
    - MANUAL_LOOKUP
    - RECEIPT_SUBMITTED
    - RECEIPT_APPROVED
    - RECEIPT_ON_HOLD
    - SAMPLE_REJECTED
    - REPORT_BOUND

ScanStatus:
  type: string
  description: >-
    Malware scan and validation status of an uploaded file (FILES_AND_REPORTS.md §1). Only `CLEAN`
    files can be used; the others are kept in quarantine.
  enum:
    - PENDING
    - CLEAN
    - INFECTED
    - ERROR
    - REJECTED

RatingDirection:
  type: string
  description: >-
    `CUSTOMER_TO_LAB`, or `LAB_TO_CUSTOMER`, which is private to the lab and the platform
    (FR-SUP-01, TENANT_ISOLATION.md §1).
  enum:
    - CUSTOMER_TO_LAB
    - LAB_TO_CUSTOMER
