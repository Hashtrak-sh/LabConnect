# Enumerations that also exist in the database (packages/database/prisma/schema/enums.prisma).
# The names and values must match the Prisma enums exactly; the test suite checks this.

RoleCode:
  type: string
  description: A role held through a membership (ROLES_AND_PERMISSIONS.md §1).
  enum:
    - CUSTOMER_ADMIN
    - CUSTOMER_REQUESTER
    - CUSTOMER_FINANCE
    - LAB_MAKER
    - LAB_CHECKER
    - PLATFORM_OPS
    - PLATFORM_DATA_STEWARD
    - PLATFORM_FINANCE
    - PLATFORM_ADMIN

OrgType:
  type: string
  enum:
    - CUSTOMER
    - LAB
    - PLATFORM

NotifChannel:
  type: string
  description: >-
    Notification channel. The MVP sends `EMAIL` and `IN_APP` only; `SMS` and `WHATSAPP` exist for
    later channels (CD-35).
  enum:
    - EMAIL
    - IN_APP
    - SMS
    - WHATSAPP

AccreditationStatus:
  type: string
  description: >-
    Status of an accreditation (SCHEMA_SPECIFICATION §5.3). Sites with a `SUSPENDED`, `WITHDRAWN`
    or `EXPIRED` accreditation are removed from search results (BR-002).
  enum:
    - VALID
    - SUSPENDED
    - WITHDRAWN
    - EXPIRED

PublicLabCategory:
  type: string
  description: >-
    Lab category of an accreditation, as shown publicly. A subset of the database enum
    `LabCategory`: `MEDICAL` (ISO 15189) is rejected at import and never shown (CD-03, BR-005).
    Only `TESTING` is bookable; `CALIBRATION` is listed and searchable but not bookable.
  enum:
    - TESTING
    - CALIBRATION
    - OTHER

PublicListingStatus:
  type: string
  description: >-
    Listing status of a lab site, as shown publicly. A subset of the database enum
    `ListingStatus`: `HIDDEN` sites are never returned. `LISTED` sites can be found but not booked
    (for example unclaimed labs, CD-04); `BOOKABLE` sites meet BR-001.
  enum:
    - LISTED
    - BOOKABLE

ScopeSiteType:
  type: string
  description: Where the lab performs the test, as published in the scope (SCHEMA_SPECIFICATION §5.5).
  enum:
    - PERMANENT
    - SITE
    - MOBILE

LeadKind:
  type: string
  description: >-
    `REQUEST_LAB`: "Request this lab" on a listed site that cannot be booked yet (FR-DAT-06,
    AC-DIS-04). `NO_RESULT`: "Request a lab" when a search has no result (FR-DIS-07, EC-05).
  enum:
    - REQUEST_LAB
    - NO_RESULT

VerificationResult:
  type: string
  description: >-
    Result of a public report verification (QR_AND_VERIFICATION §5): genuine and current, genuine
    but superseded by a newer version, not found, or revoked.
  enum:
    - GENUINE_CURRENT
    - GENUINE_SUPERSEDED
    - NOT_FOUND
    - REVOKED

# ---- P2-06a: payments and disputes (API_CONTRACTS.md §5 and §9) ----

PartyType:
  type: string
  description: The side of a booking an actor belongs to. `SYSTEM` is the platform's own jobs.
  enum:
    - CUSTOMER
    - LAB
    - PLATFORM
    - SYSTEM

GatewayCode:
  type: string
  description: >-
    The payment gateway adapter (ICICI_PAYMENT_INTEGRATION §4). `FAKE` is the deterministic test
    gateway used in local, CI and early UAT environments.
  enum:
    - ICICI
    - FAKE

PaymentOrderStatus:
  type: string
  description: >-
    Status of a payment order (BOOKING_STATE_MACHINE §4): `CREATED → PENDING → CAPTURED | FAILED |
    EXPIRED`, plus `CAPTURED → REFUNDED_PARTIAL | REFUNDED_FULL`.
  enum:
    - CREATED
    - PENDING
    - CAPTURED
    - FAILED
    - EXPIRED
    - REFUNDED_PARTIAL
    - REFUNDED_FULL

FinDocType:
  type: string
  description: Type of a financial document (FR-FIN-02, PAYMENTS_AND_LEDGER §6).
  enum:
    - TAX_INVOICE
    - PAYMENT_RECEIPT
    - CREDIT_NOTE
    - REFUND_NOTE

DisputeStatus:
  type: string
  description: >-
    Status of a dispute. BOOKING_STATE_MACHINE §4 states `OPEN → AWAITING_LAB → UNDER_REVIEW →
    DECIDED → CLOSED` (or `WITHDRAWN`); the other moves, including `AWAITING_CUSTOMER`, are not
    stated yet (OQ-38).
  enum:
    - OPEN
    - AWAITING_LAB
    - AWAITING_CUSTOMER
    - UNDER_REVIEW
    - DECIDED
    - CLOSED
    - WITHDRAWN

DisputeOutcome:
  type: string
  description: >-
    The commercial outcome Ops records (FR-SUP-03, BR-083). Technical result questions are
    referred to the lab's own ISO/IEC 17025 complaint process (BR-082).
  enum:
    - NO_ACTION
    - PARTIAL_REFUND
    - FULL_REFUND
    - REPORT_AMENDMENT_REQUIRED
    - REFERRED_TO_LAB_COMPLAINT_PROCESS

MessageVisibility:
  type: string
  description: >-
    Who sees a dispute message. `PLATFORM_ONLY` messages are never shown to either party
    (TENANT_ISOLATION §1).
  enum:
    - ALL
    - PLATFORM_ONLY
