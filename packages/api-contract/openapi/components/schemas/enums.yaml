# Enumerations that also exist in the database (packages/database/prisma/schema/enums.prisma).
# The names and values must match the Prisma enums exactly; the test suite checks this.

RoleCode:
  type: string
  description: A role held through a membership (ROLES_AND_PERMISSIONS.md §1).
  enum:
    - CUSTOMER_ADMIN
    - CUSTOMER_REQUESTER
    - CUSTOMER_FINANCE
    - LAB_MAKER
    - LAB_CHECKER
    - PLATFORM_OPS
    - PLATFORM_DATA_STEWARD
    - PLATFORM_FINANCE
    - PLATFORM_ADMIN

OrgType:
  type: string
  enum:
    - CUSTOMER
    - LAB
    - PLATFORM

NotifChannel:
  type: string
  description: >-
    Notification channel. The MVP sends `EMAIL` and `IN_APP` only; `SMS` and `WHATSAPP` exist for
    later channels (CD-35).
  enum:
    - EMAIL
    - IN_APP
    - SMS
    - WHATSAPP

AccreditationStatus:
  type: string
  description: >-
    Status of an accreditation (SCHEMA_SPECIFICATION §5.3). Sites with a `SUSPENDED`, `WITHDRAWN`
    or `EXPIRED` accreditation are removed from search results (BR-002).
  enum:
    - VALID
    - SUSPENDED
    - WITHDRAWN
    - EXPIRED

PublicLabCategory:
  type: string
  description: >-
    Lab category of an accreditation, as shown publicly. A subset of the database enum
    `LabCategory`: `MEDICAL` (ISO 15189) is rejected at import and never shown (CD-03, BR-005).
    Only `TESTING` is bookable; `CALIBRATION` is listed and searchable but not bookable.
  enum:
    - TESTING
    - CALIBRATION
    - OTHER

PublicListingStatus:
  type: string
  description: >-
    Listing status of a lab site, as shown publicly. A subset of the database enum
    `ListingStatus`: `HIDDEN` sites are never returned. `LISTED` sites can be found but not booked
    (for example unclaimed labs, CD-04); `BOOKABLE` sites meet BR-001.
  enum:
    - LISTED
    - BOOKABLE

ScopeSiteType:
  type: string
  description: Where the lab performs the test, as published in the scope (SCHEMA_SPECIFICATION §5.5).
  enum:
    - PERMANENT
    - SITE
    - MOBILE

LeadKind:
  type: string
  description: >-
    `REQUEST_LAB`: "Request this lab" on a listed site that cannot be booked yet (FR-DAT-06,
    AC-DIS-04). `NO_RESULT`: "Request a lab" when a search has no result (FR-DIS-07, EC-05).
  enum:
    - REQUEST_LAB
    - NO_RESULT

VerificationResult:
  type: string
  description: >-
    Result of a public report verification (QR_AND_VERIFICATION §5): genuine and current, genuine
    but superseded by a newer version, not found, or revoked.
  enum:
    - GENUINE_CURRENT
    - GENUINE_SUPERSEDED
    - NOT_FOUND
    - REVOKED

# --- P2-04 Lab (API_CONTRACTS.md §6) ---

BookingStatus:
  type: string
  description: Booking state (BOOKING_STATE_MACHINE.md). Only the booking engine changes it.
  enum:
    - REQUESTED
    - COUNTERED
    - ACCEPTED
    - PAID
    - HANDOVER_SET
    - SAMPLE_RECORDED
    - ON_HOLD
    - RECEIVED
    - UNDER_TEST
    - REPORT_IN_REVIEW
    - REPORT_RELEASED
    - DISPUTED
    - COMPLETED
    - REJECTED
    - EXPIRED
    - EXPIRED_UNPAID
    - NO_SHOW
    - CANCELLED

ClaimStatus:
  type: string
  description: >-
    Claim status of an organisation (`organisation.claim_status`). Lab organisations are
    `UNCLAIMED`, `CLAIM_PENDING` or `CLAIMED`; other organisations are `NOT_APPLICABLE`.
  enum:
    - UNCLAIMED
    - CLAIM_PENDING
    - CLAIMED
    - NOT_APPLICABLE

VerificationStatus:
  type: string
  description: >-
    Review status of KYC and bank details (`verification_status`). Platform staff verify them
    (FR-ONB-04).
  enum:
    - NOT_STARTED
    - SUBMITTED
    - VERIFIED
    - REJECTED

MembershipStatus:
  type: string
  enum:
    - INVITED
    - ACTIVE
    - DEACTIVATED

ClaimMethod:
  type: string
  description: >-
    How a lab claim is verified: an OTP to the NABL-registered email, or a letterhead reviewed by
    `PLATFORM_OPS` (FR-DAT-07).
  enum:
    - EMAIL_OTP
    - MANUAL

ClaimRequestStatus:
  type: string
  description: Status of a lab claim request (SCHEMA_SPECIFICATION §5.7).
  enum:
    - PENDING_OTP
    - PENDING_REVIEW
    - APPROVED
    - REJECTED
    - EXPIRED

ListingStatus:
  type: string
  description: >-
    Listing status of a lab site, derived: `HIDDEN` sites are not public, `LISTED` sites can be
    found but not booked, `BOOKABLE` sites meet BR-001.
  enum:
    - LISTED
    - BOOKABLE
    - HIDDEN

GeocodeStatus:
  type: string
  description: >-
    State of the site's map pin. Only an approved pin is published and used for distance
    (BR-004); a correction is proposed by the Checker and approved by Ops (EC-04).
  enum:
    - PENDING
    - AUTO_OK
    - LOW_CONFIDENCE
    - MANUAL_APPROVED

PriceListStatus:
  type: string
  description: >-
    `DRAFT` lists are private to the lab and editable. `PUBLISHED` lists are immutable; publishing
    a new version makes the previous one `SUPERSEDED`. A discarded draft is `DISCARDED`.
  enum:
    - DRAFT
    - PUBLISHED
    - SUPERSEDED
    - DISCARDED

SlotStatus:
  type: string
  description: >-
    `OPEN` slots can be chosen; `CLOSED` slots are closed by the Checker; `CANCELLED` slots were
    cancelled by a site closure (EC-13).
  enum:
    - OPEN
    - CLOSED
    - CANCELLED

ImportStatus:
  type: string
  description: Status of an import job (MASTER_DATA_MANAGEMENT §4).
  enum:
    - UPLOADED
    - PARSING
    - PREVIEW_READY
    - FAILED
    - COMMITTED
    - DISCARDED

ImportMatchResult:
  type: string
  description: How an import row matched existing data.
  enum:
    - NEW
    - MATCHED
    - DUPLICATE_IN_FILE
    - CONFLICT

ImportRowAction:
  type: string
  description: What committing the import does with the row.
  enum:
    - CREATE
    - UPDATE
    - NO_CHANGE
    - SKIP
    - ERROR

ChangeSetStatus:
  type: string
  description: Status of a master-data change set (MASTER_DATA_MANAGEMENT §3).
  enum:
    - DRAFT
    - IN_REVIEW
    - APPROVED
    - PUBLISHED
    - REJECTED
    - CANCELLED

LabRoleCode:
  type: string
  description: >-
    The lab role of a membership. A subset of `RoleCode`: a user holds exactly one of these in a
    lab organisation (RR-2).
  enum:
    - LAB_MAKER
    - LAB_CHECKER

LabMembershipSettableStatus:
  type: string
  description: >-
    The membership statuses a Checker can set. A subset of the database enum `MembershipStatus`:
    `INVITED` is set only by an invitation.
  enum:
    - ACTIVE
    - DEACTIVATED

LabSlotSettableStatus:
  type: string
  description: >-
    The slot statuses a Checker can set. A subset of the database enum `SlotStatus`: `CANCELLED`
    is set only by a site closure (EC-13).
  enum:
    - OPEN
    - CLOSED

LabScopeProposalOperation:
  type: string
  description: >-
    What a scope correction proposes for one scope line. Equal to the database enum
    `ChangeOperation`.
  enum:
    - CREATE
    - UPDATE
    - DEACTIVATE
    - REACTIVATE
