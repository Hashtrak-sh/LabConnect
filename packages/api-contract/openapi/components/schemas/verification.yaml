# Public report verification and share-link resolution (API_CONTRACTS.md §2,
# QR_AND_VERIFICATION.md §5, FILES_AND_REPORTS.md §4). Limited metadata only: never the PDF,
# the customer, the item, the batch, the results or any contact detail (CD-17).

VerificationCode:
  type: string
  pattern: ^[0-9A-HJKMNP-TV-Z]{16}$
  description: >-
    The code from the report QR (`https://<public-host>/v/<code>`): 16 characters of Crockford
    base32, at least 80 random bits (FILES_AND_REPORTS §3).
  examples:
    - 7GQ2X9KD4M1TRV8B

Sha256Hex:
  type: string
  pattern: ^[0-9a-f]{64}$
  description: A SHA-256 digest as 64 lower-case hex characters.
  examples:
    - 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08

VerifiedReport:
  type: object
  description: >-
    What the verification page shows for a genuine report (QR_AND_VERIFICATION §5, FR-RPT-08).
    `stampedSha256` is the hash of the stamped copy the customer received; the page compares a
    copy against it in the browser, and the file is never uploaded.
  required:
    - reportNo
    - ulrNo
    - versionNo
    - issueDate
    - stampedSha256
    - labSite
    - accreditation
    - approvedBy
    - supersededBy
  additionalProperties: false
  properties:
    reportNo:
      type: string
      maxLength: 60
    ulrNo:
      type:
        - string
        - 'null'
      maxLength: 30
    versionNo:
      type: integer
      minimum: 1
    issueDate:
      $ref: './common.yaml#/Date'
    stampedSha256:
      $ref: '#/Sha256Hex'
    labSite:
      type: object
      required:
        - name
        - city
      additionalProperties: false
      properties:
        name:
          type: string
        city:
          type: string
    accreditation:
      type: object
      description: The NABL certificate number and the accreditation status as of the issue date.
      required:
        - certificateNo
        - status
      additionalProperties: false
      properties:
        certificateNo:
          type: string
          maxLength: 50
        status:
          $ref: './enums.yaml#/AccreditationStatus'
    approvedBy:
      type: object
      description: >-
        The Checker who approved the version: name and designation (FR-RPT-08). Data-minimisation
        review pending (OQ-15).
      required:
        - name
        - designation
      additionalProperties: false
      properties:
        name:
          type: string
        designation:
          type:
            - string
            - 'null'
    supersededBy:
      description: >-
        For `GENUINE_SUPERSEDED`: the newer version and when it was released ("Superseded by vN",
        BR-065). `null` otherwise.
      oneOf:
        - type: object
          required:
            - versionNo
            - releasedAt
          additionalProperties: false
          properties:
            versionNo:
              type: integer
              minimum: 2
            releasedAt:
              $ref: './common.yaml#/Timestamp'
        - type: 'null'

ReportVerification:
  type: object
  description: >-
    The verification result. `report` is set for `GENUINE_CURRENT` and `GENUINE_SUPERSEDED`, and
    `null` for `NOT_FOUND` and `REVOKED`. A version that is not yet released verifies as
    `NOT_FOUND` (FILES_AND_REPORTS §3).
  required:
    - result
    - report
  additionalProperties: false
  properties:
    result:
      $ref: './enums.yaml#/VerificationResult'
    report:
      oneOf:
        - $ref: '#/VerifiedReport'
        - type: 'null'

ShareLinkResolution:
  type: object
  description: >-
    A short-lived download URL for the stamped copy of the shared report version, never the
    original (FILES_AND_REPORTS §4).
  required:
    - downloadUrl
    - expiresAt
  additionalProperties: false
  properties:
    downloadUrl:
      type: string
      format: uri
      description: >-
        A pre-signed GET with `Content-Disposition: attachment`, valid for 15 minutes (BR-066).
    expiresAt:
      $ref: './common.yaml#/Timestamp'
