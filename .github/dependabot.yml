# Weekly dependency updates (GIT_WORKFLOW.md section 5).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Newer LocalStack images need an account token (OQ-23). Update by hand once decided.
      - dependency-name: localstack/localstack
