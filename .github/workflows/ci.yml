# CI (task P0-06). See docs/06-engineering/CI_CD.md.
# Job names match the required status checks listed there.
name: ci

on:
  push:
    branches: ['dev-*', 'feature/**', 'hotfix/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm depcruise

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Database suite: applies every migration to an empty PostGIS database (Testcontainers),
  # then checks tables, constraints, append-only protection, RLS and Prisma drift.
  db:
    name: db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  # Contract suite (P2-08): the API in-process, every call held to the OpenAPI contract, plus the
  # staged "every documented endpoint exists" check. See TESTING_STRATEGY.md §8. Since P3-03 it
  # also runs the database-backed API tests (project http-db, Testcontainers), so this job needs
  # Docker, which ubuntu-latest has. `pnpm test` (job unit) leaves them out and needs no Docker.
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm audit --prod --audit-level high

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  # Suites that have nothing to run yet. Each job passes with a notice so the
  # required-check names exist from day one. Replace a matrix entry with a real
  # job when its suite is written (TESTING_STRATEGY.md).
  placeholder:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - check: integration
            task: Phase 3
          - check: permissions
            task: P3-05
          - check: isolation
            task: P3-05
          - check: workflow
            task: Phase 5
          - check: e2e-smoke
            task: Phase 5
    steps:
      - run: echo "::notice title=${{ matrix.check }}::Placeholder. No ${{ matrix.check }} tests exist yet (arrives with ${{ matrix.task }})."
